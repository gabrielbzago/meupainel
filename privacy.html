const DATA = {"pt-BR": {"lang": "pt-BR", "label": "Idioma", "options": ["🇧🇷 Português (Brasil)", "🇵🇹 Português (Portugal)", "🇺🇸 English", "🇪🇸 Español"], "nav": ["Início", "🔒 Privacidade", "Termos", "Planos", "Reembolso", "Cancelamento", "Atualizações"], "login": "Entrar", "badge": "🔒 Documento principal de privacidade", "title": "Política de Privacidade", "desc": "Esta Política explica como o TubeX trata dados pessoais no website, na plataforma, na extensão e nas funcionalidades que fazem referência a este documento, incluindo autenticação Google, integrações com YouTube API Services, pagamentos e ferramentas de Inteligência Artificial.", "updated": "Última atualização: 15 de agosto de 2026", "summary": "o TubeX busca coletar e utilizar apenas os dados necessários para operar a conta, entregar as funcionalidades solicitadas, administrar assinaturas, prestar suporte, proteger a plataforma e cumprir obrigações legais. O tratamento é realizado de acordo com a LGPD e demais normas aplicáveis.", "footer": "SEO, IA e ferramentas para creators.", "support": "Suporte", "last": "Última atualização desta página: 15 de agosto de 2026.", "sections": [["1. Responsável pelo tratamento e escopo", "\n<p>Para fins desta Política, o responsável pela operação do serviço é identificado comercialmente como <strong>TubeX</strong>. Os dados de contato para privacidade são <a href=\"mailto:gabrielbzago@gmail.com\">gabrielbzago@gmail.com</a>.</p>\n<p>Para assuntos relacionados à privacidade, o TubeX disponibiliza o canal de contato indicado nesta Política.</p>\n<p>Esta Política cobre o website <strong>tubex.app.br</strong>, páginas legais, plataforma e extensão TubeX e tratamentos associados às funcionalidades do serviço. O domínio <strong>tubexai.com.br</strong> é utilizado como área de acesso/login.</p>"], ["2. Quais dados podemos tratar", "\n<ul><li><strong>Cadastro e conta:</strong> nome, e-mail, identificadores de conta e informações necessárias à autenticação.</li>\n<li><strong>Assinatura e pagamento:</strong> plano, status da assinatura, identificadores de cobrança, eventos de pagamento e informações necessárias para suporte. Dados completos de cartão são tratados pelo provedor de pagamento quando aplicável, não sendo necessário ao TubeX armazenar o número completo do cartão.</li>\n<li><strong>Dados de YouTube/Google autorizados:</strong> informações de canal, vídeos, títulos, descrições, miniaturas, tags, métricas e outros dados disponibilizados pelas APIs e efetivamente necessários à funcionalidade utilizada.</li>\n<li><strong>Uso e diagnóstico:</strong> navegador, sistema operacional, versão do produto, registros técnicos, eventos de erro, IP e informações de segurança quando tecnicamente necessários.</li>\n<li><strong>Suporte:</strong> conteúdo das mensagens, e-mail e informações fornecidas voluntariamente pelo usuário.</li>\n<li><strong>Conteúdo enviado às ferramentas de IA:</strong> textos, títulos, descrições, ideias ou outros dados inseridos pelo usuário para obter uma resposta.</li></ul>\n<p>O TubeX não solicita a senha da Conta Google. A autenticação é realizada pelo fluxo oficial de autenticação do Google.</p>"], ["3. Finalidades do tratamento", "\n<ul><li>criar, autenticar e manter a conta;</li><li>fornecer SEO, pesquisa de palavras-chave, tendências, análises, IA e demais recursos solicitados;</li>\n<li>consultar e processar dados do YouTube/Google quando o usuário autorizar e a funcionalidade exigir;</li>\n<li>administrar planos, cobrança, acesso e suporte;</li><li>prevenir fraude, abuso, acesso indevido e incidentes de segurança;</li>\n<li>diagnosticar erros, manter estabilidade e melhorar desempenho;</li>\n<li>enviar comunicações operacionais sobre conta, segurança, cobrança, mudanças relevantes e suporte;</li>\n<li>cumprir obrigações legais, regulatórias e ordens de autoridades competentes.</li></ul>\n<p>O TubeX não vende dados pessoais. Dados obtidos pelas APIs do YouTube não são utilizados para publicidade personalizada ou comercializados como produto de dados.</p>"], ["4. Bases legais — LGPD", "\n<p>Conforme a finalidade e o contexto, o tratamento poderá se apoiar em uma ou mais bases legais previstas na LGPD, incluindo <strong>execução de contrato ou de procedimentos preliminares</strong>, <strong>cumprimento de obrigação legal ou regulatória</strong>, <strong>exercício regular de direitos</strong>, <strong>legítimo interesse</strong>, quando presentes seus requisitos, e <strong>consentimento</strong> quando juridicamente necessário.</p>\n<p>Quando o tratamento depender de consentimento, ele será solicitado de forma compatível com a finalidade informada e poderá ser revogado nos termos da legislação. A revogação não invalida tratamentos realizados anteriormente de forma lícita.</p>"], ["5. Google, OAuth e YouTube API Services", "\n<p>Quando necessário, o TubeX utiliza o Google OAuth para autenticação e autorização. As permissões solicitadas devem corresponder às funcionalidades oferecidas.</p>\n<p>O usuário pode revisar ou revogar autorizações concedidas ao TubeX nas configurações da Conta Google: <a href=\"https://myaccount.google.com/permissions\" target=\"_blank\" rel=\"noopener noreferrer\">Gerenciar acesso de aplicativos</a>.</p>\n<p>O uso de dados provenientes das APIs do YouTube também está sujeito aos documentos oficiais do Google/YouTube aplicáveis:</p>\n<ul><li><a href=\"https://www.youtube.com/t/terms\" target=\"_blank\" rel=\"noopener noreferrer\">Termos de Serviço do YouTube</a></li>\n<li><a href=\"https://developers.google.com/youtube/terms/api-services-terms-of-service\" target=\"_blank\" rel=\"noopener noreferrer\">YouTube API Services Terms of Service</a></li>\n<li><a href=\"https://developers.google.com/youtube/terms/developer-policies\" target=\"_blank\" rel=\"noopener noreferrer\">YouTube API Services Policies</a></li>\n<li><a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener noreferrer\">Política de Privacidade do Google</a></li></ul>\n<p>O TubeX não é afiliado, patrocinado ou endossado pelo YouTube ou pela Google LLC.</p>"], ["6. Compartilhamento e operadores", "\n<p>Podemos compartilhar ou permitir acesso limitado a dados com fornecedores que atuem em nome do TubeX, quando necessário para prestar o serviço, como:</p>\n<ul><li>provedor de autenticação e APIs Google/YouTube;</li><li>provedor de pagamentos e cobrança;</li>\n<li>hospedagem, banco de dados, infraestrutura, logs, segurança e monitoramento;</li>\n<li>provedores técnicos de Inteligência Artificial utilizados por determinada funcionalidade;</li>\n<li>serviço de processamento de formulários de suporte/cancelamento, quando utilizado;</li>\n<li>autoridades públicas ou terceiros quando houver obrigação legal, ordem válida ou necessidade de exercício/defesa de direitos.</li></ul>\n<p>Os fornecedores devem tratar os dados de acordo com suas próprias políticas e contratos aplicáveis e somente na medida necessária à prestação dos serviços contratados.</p>"], ["7. Inteligência Artificial", "\n<p>Alguns recursos podem enviar ao provedor técnico de IA as informações necessárias para gerar títulos, descrições, ideias, análises, diagnósticos ou outras respostas solicitadas pelo usuário. O TubeX busca limitar o envio ao necessário para a tarefa.</p>\n<p>Resultados gerados por IA podem conter erros e não constituem garantia de desempenho, receita, alcance ou posicionamento no YouTube. O usuário deve revisar o resultado antes de utilizá-lo.</p>"], ["8. YouTube API Data — atualização, retenção e exclusão", "\n<p>Quando o TubeX acessa dados por meio dos YouTube API Services, esses dados são utilizados somente na medida necessária para fornecer a funcionalidade solicitada pelo usuário.</p>\n<p><strong>Atualização:</strong> os dados obtidos por meio dos YouTube API Services são atualizados ou consultados novamente quando necessário para a funcionalidade aplicável e para manter as informações utilizadas pelo serviço adequadamente atualizadas, observadas as regras e prazos aplicáveis dos YouTube API Services.</p>\n<p><strong>Exclusão:</strong> quando o usuário revoga a autorização do TubeX ou solicita a exclusão dos dados, o TubeX elimina, anonimiza ou deixa de utilizar os dados de API aplicáveis conforme exigido pelas políticas do YouTube API Services e pelas obrigações legais aplicáveis.</p>\n<p>Dados que não sejam mais necessários para a finalidade para a qual foram obtidos também serão eliminados, anonimizados ou bloqueados quando aplicável, ressalvadas as hipóteses legais de conservação.</p>\n<p>O TubeX não solicita a senha da Conta Google e não utiliza métodos alternativos para contornar as permissões concedidas pelo usuário.</p>"], ["9. Direitos do titular", "\n<p>Nos termos da LGPD, o titular pode exercer, conforme aplicável, direitos como:</p>\n<ul><li>confirmação da existência de tratamento;</li><li>acesso aos dados;</li>\n<li>correção de dados incompletos, inexatos ou desatualizados;</li>\n<li>anonimização, bloqueio ou eliminação de dados desnecessários, excessivos ou tratados em desconformidade;</li>\n<li>portabilidade, observadas a regulamentação e limitações legais;</li><li>informações sobre compartilhamentos;</li>\n<li>revogação do consentimento, quando essa for a base legal;</li>\n<li>eliminação de dados tratados com consentimento, ressalvadas as hipóteses legais de conservação;</li>\n<li>oposição a determinados tratamentos realizados com base em legítimo interesse, quando presentes os requisitos legais;</li>\n<li>peticionamento perante a ANPD quando cabível.</li></ul>\n<p>Para solicitar atendimento, envie uma mensagem para <a href=\"mailto:gabrielbzago@gmail.com\">gabrielbzago@gmail.com</a> com o assunto <strong>Solicitação LGPD</strong>. Podemos solicitar informações razoáveis para confirmar a identidade e proteger a conta contra solicitações fraudulentas.</p>"], ["10. Retenção e eliminação", "\n<p>Os dados são mantidos pelo período necessário à finalidade para a qual foram coletados. Após o encerramento da conta ou solicitação de eliminação, os dados serão eliminados, anonimizados ou bloqueados quando aplicável, respeitando obrigações legais, fiscais, contratuais, segurança, prevenção à fraude, defesa de direitos e backups técnicos.</p>\n<p>Dados necessários para comprovar transações, atender obrigações legais ou defender direitos poderão permanecer pelo prazo exigido pela legislação aplicável.</p>"], ["11. Segurança da informação", "\n<p>O TubeX adota medidas técnicas e administrativas razoáveis para reduzir riscos de acesso não autorizado, perda, alteração, divulgação ou destruição indevida, incluindo controles de acesso, autenticação por terceiros confiáveis, proteção de infraestrutura e monitoramento técnico quando aplicável.</p>\n<p>Nenhum serviço conectado à Internet pode garantir segurança absoluta. Em caso de incidente de segurança que possa acarretar risco ou dano relevante aos titulares, serão adotadas as providências de comunicação e mitigação exigidas pela legislação aplicável.</p>"], ["12. Cookies, armazenamento local e tecnologias semelhantes", "\n<p>O TubeX poderá utilizar cookies, localStorage e tecnologias semelhantes para autenticação, preferências, segurança, funcionamento da aplicação, desempenho e diagnóstico. Tecnologias não essenciais, quando utilizadas, deverão respeitar as regras aplicáveis e as opções disponibilizadas ao usuário.</p>\n<p>O bloqueio de tecnologias estritamente necessárias pode impedir determinadas funcionalidades.</p>"], ["13. Transferências internacionais", "\n<p>Alguns fornecedores de infraestrutura, autenticação, pagamentos, IA ou suporte podem processar dados fora do Brasil. Quando houver transferência internacional, o TubeX buscará utilizar mecanismos compatíveis com a LGPD e com a regulamentação aplicável da ANPD, além de limitar o tratamento ao necessário.</p>"], ["14. Crianças e adolescentes", "\n<p>O serviço é direcionado a criadores de conteúdo e não é concebido especificamente para crianças. Quando houver tratamento de dados de crianças ou adolescentes, serão observadas as regras legais aplicáveis e o melhor interesse do titular.</p>"], ["15. Dados públicos e métricas do YouTube", "\n<p>Algumas funcionalidades analisam informações públicas ou legitimamente disponibilizadas pelas APIs do YouTube. Indicadores próprios do TubeX, como scores, estimativas, concorrência, oportunidade ou recomendações, são cálculos da plataforma e não são métricas oficiais do YouTube.</p>"], ["16. Alterações desta Política", "\n<p>Esta Política poderá ser atualizada para refletir mudanças legais, técnicas, operacionais ou nas funcionalidades. A versão vigente será publicada nesta página com sua data de atualização. Quando a lei exigir comunicação específica ou novo consentimento, serão adotadas as medidas cabíveis.</p>"], ["17. Contato de privacidade", "\n<p><strong>E-mail:</strong> <a href=\"mailto:gabrielbzago@gmail.com\">gabrielbzago@gmail.com</a><br><strong>Website oficial:</strong> <a href=\"https://www.tubex.app.br\">www.tubex.app.br</a></p>\n<p>O canal acima também pode ser utilizado para solicitações relacionadas aos direitos previstos na LGPD. Caso o enquadramento jurídico do agente de tratamento dispense a indicação formal de encarregado, o mesmo canal será utilizado para comunicação de privacidade.</p>"]]}, "pt-PT": {"lang": "pt-PT", "label": "Idioma", "options": ["🇧🇷 Português (Brasil)", "🇵🇹 Português (Portugal)", "🇺🇸 English", "🇪🇸 Español"], "nav": ["Início", "🔒 Privacidade", "Termos", "Planos", "Reembolsos", "Cancelamento", "Atualizações"], "login": "Entrar", "badge": "🔒 Documento principal de privacidade", "title": "Política de Privacidade", "desc": "Esta Política explica como o TubeX trata dados pessoais no website, na plataforma, na extensão e nas funcionalidades que fazem referência a este documento, incluindo autenticação Google, integrações com YouTube API Services, pagamentos e ferramentas de Inteligência Artificial.", "updated": "Última atualização: 15 de agosto de 2026", "summary": "o TubeX procura recolher e utilizar apenas os dados necessários para operar a conta, disponibilizar as funcionalidades solicitadas, administrar subscrições, prestar apoio, proteger a plataforma e cumprir obrigações legais. O tratamento é realizado de acordo com a legislação aplicável.", "footer": "SEO, IA e ferramentas para creators.", "support": "Suporte", "last": "Última atualização desta página: 15 de agosto de 2026.", "sections": [["1. Responsável pelo tratamento e âmbito", "<p>Para efeitos desta Política, o responsável pela operação do serviço é identificado comercialmente como <strong>TubeX</strong>. O contacto para questões de privacidade é <a href=\"mailto:gabrielbzago@gmail.com\">gabrielbzago@gmail.com</a>.</p><p>Para assuntos relacionados com privacidade, o TubeX disponibiliza o canal de contacto indicado nesta Política.</p><p>Esta Política abrange o website <strong>tubex.app.br</strong>, páginas legais, plataforma e extensão TubeX e os tratamentos associados às funcionalidades do serviço. O domínio <strong>tubexai.com.br</strong> é utilizado como área de acesso/login.</p>"], ["2. Que dados podemos tratar", "<ul><li><strong>Registo e conta:</strong> nome, e-mail, identificadores da conta e informações necessárias para a autenticação.</li><li><strong>Subscrição e pagamento:</strong> plano, estado da subscrição, identificadores de cobrança, eventos de pagamento e informações necessárias para apoio. Os dados completos do cartão são tratados pelo prestador de pagamentos, quando aplicável, não sendo necessário ao TubeX armazenar o número completo do cartão.</li><li><strong>Dados autorizados do YouTube/Google:</strong> informações do canal, vídeos, títulos, descrições, miniaturas, tags, métricas e outros dados disponibilizados pelas APIs e efetivamente necessários para a funcionalidade utilizada.</li><li><strong>Utilização e diagnóstico:</strong> navegador, sistema operativo, versão do produto, registos técnicos, eventos de erro, IP e informações de segurança quando tecnicamente necessários.</li><li><strong>Apoio:</strong> conteúdo das mensagens, e-mail e informações fornecidas voluntariamente pelo utilizador.</li><li><strong>Conteúdo enviado para ferramentas de IA:</strong> textos, títulos, descrições, ideias ou outros dados introduzidos pelo utilizador para obter uma resposta.</li></ul><p>O TubeX não solicita a palavra-passe da Conta Google. A autenticação é realizada através do fluxo oficial de autenticação do Google.</p>"], ["3. Finalidades do tratamento", "<ul><li>criar, autenticar e manter a conta;</li><li>fornecer SEO, pesquisa de palavras-chave, tendências, análises, IA e outros recursos solicitados;</li><li>consultar e processar dados do YouTube/Google quando o utilizador autorizar e a funcionalidade o exigir;</li><li>administrar planos, cobrança, acesso e apoio;</li><li>prevenir fraude, abuso, acesso indevido e incidentes de segurança;</li><li>diagnosticar erros, manter a estabilidade e melhorar o desempenho;</li><li>enviar comunicações operacionais sobre conta, segurança, cobrança, alterações relevantes e apoio;</li><li>cumprir obrigações legais, regulamentares e ordens de autoridades competentes.</li></ul><p>O TubeX não vende dados pessoais. Os dados obtidos através das APIs do YouTube não são utilizados para publicidade personalizada nem comercializados como produto de dados.</p>"], ["4. Bases legais", "<p>Consoante a finalidade e o contexto, o tratamento poderá basear-se numa ou mais bases legais aplicáveis, incluindo execução de contrato ou de procedimentos preliminares, cumprimento de obrigação legal ou regulamentar, exercício regular de direitos, interesse legítimo quando estejam reunidos os respetivos requisitos e consentimento quando juridicamente necessário.</p><p>Quando o tratamento depender de consentimento, este será solicitado de forma compatível com a finalidade informada e poderá ser revogado nos termos da legislação aplicável. A revogação não invalida tratamentos realizados anteriormente de forma lícita.</p>"], ["5. Google, OAuth e YouTube API Services", "<p>Quando necessário, o TubeX utiliza o Google OAuth para autenticação e autorização. As permissões solicitadas devem corresponder às funcionalidades disponibilizadas.</p><p>O utilizador pode rever ou revogar autorizações concedidas ao TubeX nas definições da Conta Google: <a href=\"https://myaccount.google.com/permissions\" target=\"_blank\" rel=\"noopener noreferrer\">Gerir o acesso de aplicações</a>.</p><p>A utilização de dados provenientes das APIs do YouTube também está sujeita aos documentos oficiais aplicáveis do Google/YouTube:</p><ul><li><a href=\"https://www.youtube.com/t/terms\" target=\"_blank\" rel=\"noopener noreferrer\">Termos de Serviço do YouTube</a></li><li><a href=\"https://developers.google.com/youtube/terms/api-services-terms-of-service\" target=\"_blank\" rel=\"noopener noreferrer\">YouTube API Services Terms of Service</a></li><li><a href=\"https://developers.google.com/youtube/terms/developer-policies\" target=\"_blank\" rel=\"noopener noreferrer\">YouTube API Services Policies</a></li><li><a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener noreferrer\">Política de Privacidade do Google</a></li></ul><p>O TubeX não é afiliado, patrocinado ou endossado pelo YouTube ou pela Google LLC.</p>"], ["6. Partilha e prestadores", "<p>Podemos partilhar ou permitir acesso limitado a dados com fornecedores que atuem em nome do TubeX, quando necessário para prestar o serviço, tais como:</p><ul><li>prestador de autenticação e APIs Google/YouTube;</li><li>prestador de pagamentos e cobrança;</li><li>alojamento, base de dados, infraestrutura, registos, segurança e monitorização;</li><li>prestadores técnicos de Inteligência Artificial utilizados por determinada funcionalidade;</li><li>serviços de processamento de formulários de apoio/cancelamento, quando utilizados;</li><li>autoridades públicas ou terceiros quando exista obrigação legal, ordem válida ou necessidade de exercício/defesa de direitos.</li></ul><p>Os fornecedores devem tratar os dados de acordo com as suas próprias políticas e contratos aplicáveis e apenas na medida necessária à prestação dos serviços contratados.</p>"], ["7. Inteligência Artificial", "<p>Alguns recursos podem enviar ao prestador técnico de IA as informações necessárias para gerar títulos, descrições, ideias, análises, diagnósticos ou outras respostas solicitadas pelo utilizador. O TubeX procura limitar o envio ao necessário para a tarefa.</p><p>Os resultados gerados por IA podem conter erros e não constituem garantia de desempenho, receita, alcance ou posicionamento no YouTube. O utilizador deve rever o resultado antes de o utilizar.</p>"], ["8. YouTube API Data — atualização, retenção e eliminação", "<p>Quando o TubeX acede a dados através dos YouTube API Services, esses dados são utilizados apenas na medida necessária para fornecer a funcionalidade solicitada pelo utilizador.</p><p><strong>Atualização:</strong> os dados obtidos através dos YouTube API Services são atualizados ou consultados novamente quando necessário para a funcionalidade aplicável e para manter adequadamente atualizadas as informações utilizadas pelo serviço, respeitando as regras e os prazos aplicáveis dos YouTube API Services.</p><p><strong>Eliminação:</strong> quando o utilizador revoga a autorização do TubeX ou solicita a eliminação dos dados, o TubeX elimina, anonimiza ou deixa de utilizar os dados de API aplicáveis conforme exigido pelas políticas dos YouTube API Services e pelas obrigações legais aplicáveis.</p><p>Os dados que deixem de ser necessários para a finalidade para a qual foram obtidos também serão eliminados, anonimizados ou bloqueados quando aplicável, sem prejuízo das hipóteses legais de conservação.</p><p>O TubeX não solicita a palavra-passe da Conta Google nem utiliza métodos alternativos para contornar as permissões concedidas pelo utilizador.</p>"], ["9. Direitos do titular", "<p>Quando aplicável, o titular pode exercer direitos previstos na legislação de proteção de dados, incluindo confirmação da existência de tratamento, acesso, correção, eliminação ou anonimização quando legalmente aplicável, informação sobre partilhas, portabilidade quando prevista, revogação do consentimento quando essa for a base legal e oposição a determinados tratamentos quando legalmente admissível.</p><p>Para solicitar atendimento, envie uma mensagem para <a href=\"mailto:gabrielbzago@gmail.com\">gabrielbzago@gmail.com</a> com o assunto <strong>Solicitação de Privacidade</strong>. Poderemos solicitar informações razoáveis para confirmar a identidade e proteger a conta contra pedidos fraudulentos.</p>"], ["10. Retenção e eliminação", "<p>Os dados são mantidos durante o período necessário à finalidade para a qual foram recolhidos. Após o encerramento da conta ou pedido de eliminação, os dados serão eliminados, anonimizados ou bloqueados quando aplicável, respeitando obrigações legais, fiscais, contratuais, segurança, prevenção de fraude, defesa de direitos e cópias de segurança técnicas.</p><p>Os dados necessários para comprovar transações, cumprir obrigações legais ou defender direitos poderão permanecer durante o período exigido pela legislação aplicável.</p>"], ["11. Segurança da informação", "<p>O TubeX adota medidas técnicas e administrativas razoáveis para reduzir riscos de acesso não autorizado, perda, alteração, divulgação ou destruição indevida, incluindo controlos de acesso, autenticação através de terceiros confiáveis, proteção da infraestrutura e monitorização técnica quando aplicável.</p><p>Nenhum serviço ligado à Internet pode garantir segurança absoluta. Em caso de incidente de segurança que possa acarretar risco ou dano relevante para os titulares, serão adotadas as medidas de comunicação e mitigação exigidas pela legislação aplicável.</p>"], ["12. Cookies, armazenamento local e tecnologias semelhantes", "<p>O TubeX poderá utilizar cookies, localStorage e tecnologias semelhantes para autenticação, preferências, segurança, funcionamento da aplicação, desempenho e diagnóstico. Tecnologias não essenciais, quando utilizadas, deverão respeitar as regras aplicáveis e as opções disponibilizadas ao utilizador.</p><p>O bloqueio de tecnologias estritamente necessárias pode impedir determinadas funcionalidades.</p>"], ["13. Transferências internacionais", "<p>Alguns fornecedores de infraestrutura, autenticação, pagamentos, IA ou apoio podem processar dados fora do Brasil. Quando houver transferência internacional, o TubeX procurará utilizar mecanismos compatíveis com a legislação de proteção de dados aplicável e limitar o tratamento ao necessário.</p>"], ["14. Crianças e adolescentes", "<p>O serviço é direcionado a criadores de conteúdo e não é concebido especificamente para crianças. Quando houver tratamento de dados de crianças ou adolescentes, serão observadas as regras legais aplicáveis e o melhor interesse do titular.</p>"], ["15. Dados públicos e métricas do YouTube", "<p>Algumas funcionalidades analisam informações públicas ou legitimamente disponibilizadas pelas APIs do YouTube. Indicadores próprios do TubeX, como scores, estimativas, concorrência, oportunidade ou recomendações, são cálculos da plataforma e não são métricas oficiais do YouTube.</p>"], ["16. Alterações desta Política", "<p>Esta Política poderá ser atualizada para refletir alterações legais, técnicas, operacionais ou nas funcionalidades. A versão vigente será publicada nesta página com a respetiva data de atualização. Quando a lei exigir comunicação específica ou novo consentimento, serão adotadas as medidas cabíveis.</p>"], ["17. Contacto de privacidade", "<p><strong>E-mail:</strong> <a href=\"mailto:gabrielbzago@gmail.com\">gabrielbzago@gmail.com</a><br><strong>Website oficial:</strong> <a href=\"https://www.tubex.app.br\">www.tubex.app.br</a></p><p>O canal acima também pode ser utilizado para pedidos relacionados com os direitos de proteção de dados. Caso o enquadramento jurídico do responsável pelo tratamento dispense a indicação formal de encarregado, o mesmo canal será utilizado para comunicações de privacidade.</p>"]]}, "en": {"lang": "en", "label": "Language", "options": ["🇧🇷 Portuguese (Brazil)", "🇵🇹 Portuguese (Portugal)", "🇺🇸 English", "🇪🇸 Spanish"], "nav": ["Home", "🔒 Privacy", "Terms", "Plans", "Refunds", "Cancellation", "Updates"], "login": "Sign in", "badge": "🔒 Main privacy document", "title": "Privacy Policy", "desc": "This Policy explains how TubeX handles personal data on its website, platform, extension, and features that reference this document, including Google authentication, integrations with YouTube API Services, payments, and Artificial Intelligence tools.", "updated": "Last updated: August 15, 2026", "summary": "TubeX seeks to collect and use only the data necessary to operate accounts, provide requested features, administer subscriptions, provide support, protect the platform, and comply with legal obligations. Processing is carried out in accordance with applicable data protection laws.", "footer": "SEO, AI, and tools for creators.", "support": "Support", "last": "Last updated: August 15, 2026.", "sections": [["1. Data Controller and Scope", "<p>For purposes of this Policy, the service operator is commercially identified as <strong>TubeX</strong>. The privacy contact is <a href=\"mailto:gabrielbzago@gmail.com\">gabrielbzago@gmail.com</a>.</p><p>For privacy-related matters, TubeX provides the contact channel identified in this Policy.</p><p>This Policy covers the <strong>tubex.app.br</strong> website, legal pages, TubeX platform and extension, and processing associated with the service features. The <strong>tubexai.com.br</strong> domain is used as the access/login area.</p>"], ["2. Data We May Process", "<ul><li><strong>Registration and account:</strong> name, email, account identifiers, and information necessary for authentication.</li><li><strong>Subscription and payment:</strong> plan, subscription status, billing identifiers, payment events, and information necessary for support. Full card details are handled by the payment provider where applicable; TubeX does not need to store the full card number.</li><li><strong>Authorized YouTube/Google data:</strong> channel information, videos, titles, descriptions, thumbnails, tags, metrics, and other data made available through the APIs and actually required for the feature being used.</li><li><strong>Usage and diagnostics:</strong> browser, operating system, product version, technical logs, error events, IP address, and security information when technically necessary.</li><li><strong>Support:</strong> message content, email, and information voluntarily provided by the user.</li><li><strong>Content submitted to AI tools:</strong> text, titles, descriptions, ideas, or other data entered by the user to obtain a response.</li></ul><p>TubeX does not request the user's Google Account password. Authentication is performed through Google's official authentication flow.</p>"], ["3. Purposes of Processing", "<ul><li>create, authenticate, and maintain accounts;</li><li>provide SEO, keyword research, trends, analytics, AI, and other requested features;</li><li>access and process YouTube/Google data when authorized by the user and required by the feature;</li><li>administer plans, billing, access, and support;</li><li>prevent fraud, abuse, unauthorized access, and security incidents;</li><li>diagnose errors, maintain stability, and improve performance;</li><li>send operational communications regarding accounts, security, billing, relevant changes, and support;</li><li>comply with legal and regulatory obligations and valid requests from competent authorities.</li></ul><p>TubeX does not sell personal data. Data obtained through YouTube APIs is not used for personalized advertising or commercialized as a data product.</p>"], ["4. Legal Bases", "<p>Depending on the purpose and context, processing may rely on one or more applicable legal bases, including performance of a contract or pre-contractual measures, compliance with legal obligations, establishment or defense of legal claims, legitimate interests where applicable, and consent where legally required.</p><p>Where processing relies on consent, consent will be requested consistently with the stated purpose and may be withdrawn as permitted by applicable law. Withdrawal does not invalidate processing lawfully carried out before withdrawal.</p>"], ["5. Google, OAuth and YouTube API Services", "<p>Where necessary, TubeX uses Google OAuth for authentication and authorization. Requested permissions should correspond to the features provided.</p><p>Users can review or revoke permissions granted to TubeX in their Google Account settings: <a href=\"https://myaccount.google.com/permissions\" target=\"_blank\" rel=\"noopener noreferrer\">Manage app access</a>.</p><p>Use of data obtained from YouTube APIs is also subject to applicable official Google/YouTube documents:</p><ul><li><a href=\"https://www.youtube.com/t/terms\" target=\"_blank\" rel=\"noopener noreferrer\">YouTube Terms of Service</a></li><li><a href=\"https://developers.google.com/youtube/terms/api-services-terms-of-service\" target=\"_blank\" rel=\"noopener noreferrer\">YouTube API Services Terms of Service</a></li><li><a href=\"https://developers.google.com/youtube/terms/developer-policies\" target=\"_blank\" rel=\"noopener noreferrer\">YouTube API Services Policies</a></li><li><a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener noreferrer\">Google Privacy Policy</a></li></ul><p>TubeX is not affiliated with, sponsored by, or endorsed by YouTube or Google LLC.</p>"], ["6. Sharing and Service Providers", "<p>We may share or provide limited access to data with vendors acting on behalf of TubeX when necessary to provide the service, such as:</p><ul><li>Google/YouTube authentication and API providers;</li><li>payment and billing providers;</li><li>hosting, databases, infrastructure, logs, security, and monitoring providers;</li><li>technical Artificial Intelligence providers used by a specific feature;</li><li>support/cancellation form processing services when used;</li><li>public authorities or third parties when required by law, a valid order, or necessary to establish or defend legal rights.</li></ul><p>Vendors are expected to process data in accordance with their applicable policies and contracts and only to the extent necessary to provide the contracted services.</p>"], ["7. Artificial Intelligence", "<p>Some features may send information necessary to generate titles, descriptions, ideas, analyses, diagnostics, or other user-requested responses to a technical AI provider. TubeX seeks to limit the information sent to what is necessary for the task.</p><p>AI-generated results may contain errors and do not guarantee performance, revenue, reach, or YouTube ranking. Users should review results before using them.</p>"], ["8. YouTube API Data — Updates, Retention and Deletion", "<p>When TubeX accesses data through YouTube API Services, that data is used only to the extent necessary to provide the feature requested by the user.</p><p><strong>Updates:</strong> data obtained through YouTube API Services is refreshed or queried again when necessary for the applicable feature and to keep information used by the service appropriately current, subject to the applicable YouTube API Services rules and time limits.</p><p><strong>Deletion:</strong> when a user revokes TubeX authorization or requests deletion of data, TubeX deletes, anonymizes, or stops using applicable API data as required by YouTube API Services policies and applicable legal obligations.</p><p>Data that is no longer necessary for the purpose for which it was obtained will also be deleted, anonymized, or blocked where applicable, subject to legally required retention.</p><p>TubeX does not request a Google Account password and does not use alternative methods to bypass permissions granted by the user.</p>"], ["9. Data Subject Rights", "<p>Where applicable under data protection law, individuals may have rights including confirmation of processing, access, correction, deletion or anonymization where legally applicable, information about sharing, portability where provided by law, withdrawal of consent where consent is the legal basis, and objection to certain processing where legally available.</p><p>To submit a request, email <a href=\"mailto:gabrielbzago@gmail.com\">gabrielbzago@gmail.com</a> with the subject <strong>Privacy Request</strong>. We may request reasonable information to verify identity and protect the account against fraudulent requests.</p>"], ["10. Retention and Deletion", "<p>Data is retained for as long as necessary for the purpose for which it was collected. After account closure or a deletion request, data will be deleted, anonymized, or blocked where applicable, subject to legal, tax, contractual, security, fraud-prevention, legal-defense, and technical backup requirements.</p><p>Data needed to evidence transactions, comply with legal obligations, or establish or defend legal rights may be retained for the period required by applicable law.</p>"], ["11. Information Security", "<p>TubeX adopts reasonable technical and administrative measures to reduce risks of unauthorized access, loss, alteration, disclosure, or improper destruction, including access controls, authentication through trusted third parties, infrastructure protection, and technical monitoring where applicable.</p><p>No Internet-connected service can guarantee absolute security. If a security incident may create a relevant risk or harm to individuals, TubeX will take communication and mitigation measures required by applicable law.</p>"], ["12. Cookies, Local Storage and Similar Technologies", "<p>TubeX may use cookies, localStorage, and similar technologies for authentication, preferences, security, application functionality, performance, and diagnostics. Non-essential technologies, when used, will be subject to applicable rules and the choices made available to users.</p><p>Blocking strictly necessary technologies may prevent certain features from functioning.</p>"], ["13. International Transfers", "<p>Some infrastructure, authentication, payment, AI, or support providers may process data outside Brazil. Where an international transfer occurs, TubeX seeks to use mechanisms compatible with applicable data protection requirements and to limit processing to what is necessary.</p>"], ["14. Children and Minors", "<p>The service is directed at content creators and is not specifically designed for children. Where data relating to children or minors is processed, applicable legal requirements and the best interests of the individual will be considered.</p>"], ["15. Public Data and YouTube Metrics", "<p>Some features analyze public information or information legitimately made available through YouTube APIs. TubeX-created indicators, such as scores, estimates, competition, opportunity, or recommendations, are calculations produced by the platform and are not official YouTube metrics.</p>"], ["16. Changes to This Policy", "<p>This Policy may be updated to reflect legal, technical, operational, or feature changes. The current version will be published on this page with its update date. Where applicable law requires specific notice or renewed consent, appropriate measures will be taken.</p>"], ["17. Privacy Contact", "<p><strong>Email:</strong> <a href=\"mailto:gabrielbzago@gmail.com\">gabrielbzago@gmail.com</a><br><strong>Official website:</strong> <a href=\"https://www.tubex.app.br\">www.tubex.app.br</a></p><p>The contact above may also be used for requests concerning applicable data protection rights. Where the legal framework does not require a formal data protection officer designation, the same channel will be used for privacy communications.</p>"]]}, "es": {"lang": "es", "label": "Idioma", "options": ["🇧🇷 Portugués (Brasil)", "🇵🇹 Portugués (Portugal)", "🇺🇸 Inglés", "🇪🇸 Español"], "nav": ["Inicio", "🔒 Privacidad", "Términos", "Planes", "Reembolsos", "Cancelación", "Actualizaciones"], "login": "Entrar", "badge": "🔒 Documento principal de privacidad", "title": "Política de Privacidad", "desc": "Esta Política explica cómo TubeX trata los datos personales en el sitio web, la plataforma, la extensión y las funciones que hacen referencia a este documento, incluida la autenticación de Google, las integraciones con YouTube API Services, los pagos y las herramientas de Inteligencia Artificial.", "updated": "Última actualización: 15 de agosto de 2026", "summary": "TubeX busca recopilar y utilizar únicamente los datos necesarios para operar la cuenta, proporcionar las funciones solicitadas, administrar suscripciones, prestar soporte, proteger la plataforma y cumplir obligaciones legales. El tratamiento se realiza de acuerdo con la legislación aplicable.", "footer": "SEO, IA y herramientas para creadores.", "support": "Soporte", "last": "Última actualización: 15 de agosto de 2026.", "sections": [["1. Responsable del tratamiento y alcance", "<p>A efectos de esta Política, el operador del servicio se identifica comercialmente como <strong>TubeX</strong>. El contacto de privacidad es <a href=\"mailto:gabrielbzago@gmail.com\">gabrielbzago@gmail.com</a>.</p><p>Para asuntos relacionados con la privacidad, TubeX ofrece el canal de contacto indicado en esta Política.</p><p>Esta Política cubre el sitio web <strong>tubex.app.br</strong>, las páginas legales, la plataforma y extensión TubeX y los tratamientos asociados a las funcionalidades del servicio. El dominio <strong>tubexai.com.br</strong> se utiliza como área de acceso/inicio de sesión.</p>"], ["2. Datos que podemos tratar", "<ul><li><strong>Registro y cuenta:</strong> nombre, correo electrónico, identificadores de cuenta e información necesaria para la autenticación.</li><li><strong>Suscripción y pago:</strong> plan, estado de la suscripción, identificadores de facturación, eventos de pago e información necesaria para soporte. Los datos completos de la tarjeta son tratados por el proveedor de pagos cuando corresponde; TubeX no necesita almacenar el número completo de la tarjeta.</li><li><strong>Datos autorizados de YouTube/Google:</strong> información del canal, vídeos, títulos, descripciones, miniaturas, etiquetas, métricas y otros datos disponibles mediante las APIs y realmente necesarios para la funcionalidad utilizada.</li><li><strong>Uso y diagnóstico:</strong> navegador, sistema operativo, versión del producto, registros técnicos, eventos de error, dirección IP e información de seguridad cuando sea técnicamente necesaria.</li><li><strong>Soporte:</strong> contenido de los mensajes, correo electrónico e información proporcionada voluntariamente por el usuario.</li><li><strong>Contenido enviado a herramientas de IA:</strong> textos, títulos, descripciones, ideas u otros datos introducidos por el usuario para obtener una respuesta.</li></ul><p>TubeX no solicita la contraseña de la Cuenta de Google. La autenticación se realiza mediante el flujo oficial de autenticación de Google.</p>"], ["3. Finalidades del tratamiento", "<ul><li>crear, autenticar y mantener la cuenta;</li><li>proporcionar SEO, investigación de palabras clave, tendencias, análisis, IA y otras funciones solicitadas;</li><li>consultar y procesar datos de YouTube/Google cuando el usuario lo autorice y la función lo requiera;</li><li>administrar planes, facturación, acceso y soporte;</li><li>prevenir fraude, abuso, acceso no autorizado e incidentes de seguridad;</li><li>diagnosticar errores, mantener la estabilidad y mejorar el rendimiento;</li><li>enviar comunicaciones operativas sobre cuenta, seguridad, facturación, cambios relevantes y soporte;</li><li>cumplir obligaciones legales y regulatorias y solicitudes válidas de autoridades competentes.</li></ul><p>TubeX no vende datos personales. Los datos obtenidos mediante las APIs de YouTube no se utilizan para publicidad personalizada ni se comercializan como producto de datos.</p>"], ["4. Bases legales", "<p>Según la finalidad y el contexto, el tratamiento puede basarse en una o más bases legales aplicables, incluyendo la ejecución de un contrato o medidas precontractuales, el cumplimiento de obligaciones legales, el establecimiento o defensa de derechos, el interés legítimo cuando corresponda y el consentimiento cuando sea legalmente necesario.</p><p>Cuando el tratamiento dependa del consentimiento, este se solicitará de forma compatible con la finalidad informada y podrá retirarse conforme a la legislación aplicable. La retirada no invalida los tratamientos realizados lícitamente con anterioridad.</p>"], ["5. Google, OAuth y YouTube API Services", "<p>Cuando es necesario, TubeX utiliza Google OAuth para autenticación y autorización. Los permisos solicitados deben corresponder a las funciones ofrecidas.</p><p>El usuario puede revisar o revocar los permisos concedidos a TubeX en la configuración de su Cuenta de Google: <a href=\"https://myaccount.google.com/permissions\" target=\"_blank\" rel=\"noopener noreferrer\">Gestionar acceso de aplicaciones</a>.</p><p>El uso de datos obtenidos de las APIs de YouTube también está sujeto a los documentos oficiales aplicables de Google/YouTube:</p><ul><li><a href=\"https://www.youtube.com/t/terms\" target=\"_blank\" rel=\"noopener noreferrer\">Términos del Servicio de YouTube</a></li><li><a href=\"https://developers.google.com/youtube/terms/api-services-terms-of-service\" target=\"_blank\" rel=\"noopener noreferrer\">YouTube API Services Terms of Service</a></li><li><a href=\"https://developers.google.com/youtube/terms/developer-policies\" target=\"_blank\" rel=\"noopener noreferrer\">YouTube API Services Policies</a></li><li><a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener noreferrer\">Política de Privacidad de Google</a></li></ul><p>TubeX no está afiliado, patrocinado ni respaldado por YouTube o Google LLC.</p>"], ["6. Compartición y proveedores", "<p>Podemos compartir o permitir acceso limitado a datos con proveedores que actúen en nombre de TubeX cuando sea necesario para prestar el servicio, como:</p><ul><li>proveedores de autenticación y APIs de Google/YouTube;</li><li>proveedores de pagos y facturación;</li><li>alojamiento, bases de datos, infraestructura, registros, seguridad y monitorización;</li><li>proveedores técnicos de Inteligencia Artificial utilizados por una función determinada;</li><li>servicios de procesamiento de formularios de soporte/cancelación cuando se utilicen;</li><li>autoridades públicas o terceros cuando exista una obligación legal, una orden válida o sea necesario para ejercer o defender derechos.</li></ul><p>Los proveedores deben tratar los datos de acuerdo con sus políticas y contratos aplicables y solo en la medida necesaria para prestar los servicios contratados.</p>"], ["7. Inteligencia Artificial", "<p>Algunas funciones pueden enviar al proveedor técnico de IA la información necesaria para generar títulos, descripciones, ideas, análisis, diagnósticos u otras respuestas solicitadas por el usuario. TubeX procura limitar la información enviada a lo necesario para la tarea.</p><p>Los resultados generados por IA pueden contener errores y no garantizan rendimiento, ingresos, alcance ni posicionamiento en YouTube. El usuario debe revisar los resultados antes de utilizarlos.</p>"], ["8. YouTube API Data — actualización, conservación y eliminación", "<p>Cuando TubeX accede a datos mediante YouTube API Services, esos datos se utilizan únicamente en la medida necesaria para proporcionar la función solicitada por el usuario.</p><p><strong>Actualización:</strong> los datos obtenidos mediante YouTube API Services se actualizan o consultan nuevamente cuando es necesario para la función correspondiente y para mantener adecuadamente actualizada la información utilizada por el servicio, de acuerdo con las reglas y plazos aplicables de YouTube API Services.</p><p><strong>Eliminación:</strong> cuando el usuario revoca la autorización de TubeX o solicita la eliminación de los datos, TubeX elimina, anonimiza o deja de utilizar los datos de API correspondientes según lo exigido por las políticas de YouTube API Services y las obligaciones legales aplicables.</p><p>Los datos que ya no sean necesarios para la finalidad para la que fueron obtenidos también se eliminarán, anonimizarán o bloquearán cuando corresponda, sin perjuicio de las obligaciones legales de conservación.</p><p>TubeX no solicita la contraseña de la Cuenta de Google ni utiliza métodos alternativos para eludir los permisos concedidos por el usuario.</p>"], ["9. Derechos del titular", "<p>Cuando sea aplicable conforme a la legislación de protección de datos, las personas pueden tener derechos como confirmación del tratamiento, acceso, corrección, eliminación o anonimización cuando corresponda, información sobre compartición, portabilidad cuando la ley la contemple, retirada del consentimiento cuando sea la base legal y oposición a determinados tratamientos cuando esté legalmente disponible.</p><p>Para realizar una solicitud, envíe un correo a <a href=\"mailto:gabrielbzago@gmail.com\">gabrielbzago@gmail.com</a> con el asunto <strong>Solicitud de privacidad</strong>. Podemos solicitar información razonable para verificar la identidad y proteger la cuenta frente a solicitudes fraudulentas.</p>"], ["10. Conservación y eliminación", "<p>Los datos se conservan durante el tiempo necesario para la finalidad para la que fueron recopilados. Después del cierre de la cuenta o de una solicitud de eliminación, los datos se eliminarán, anonimizarán o bloquearán cuando corresponda, respetando obligaciones legales, fiscales, contractuales, de seguridad, prevención del fraude, defensa de derechos y copias de seguridad técnicas.</p><p>Los datos necesarios para acreditar transacciones, cumplir obligaciones legales o establecer o defender derechos podrán conservarse durante el período exigido por la legislación aplicable.</p>"], ["11. Seguridad de la información", "<p>TubeX adopta medidas técnicas y administrativas razonables para reducir los riesgos de acceso no autorizado, pérdida, alteración, divulgación o destrucción indebida, incluidos controles de acceso, autenticación mediante terceros de confianza, protección de infraestructura y monitorización técnica cuando corresponda.</p><p>Ningún servicio conectado a Internet puede garantizar una seguridad absoluta. En caso de un incidente de seguridad que pueda causar un riesgo o daño relevante a los titulares, se adoptarán las medidas de comunicación y mitigación exigidas por la legislación aplicable.</p>"], ["12. Cookies, almacenamiento local y tecnologías similares", "<p>TubeX puede utilizar cookies, localStorage y tecnologías similares para autenticación, preferencias, seguridad, funcionamiento de la aplicación, rendimiento y diagnóstico. Las tecnologías no esenciales, cuando se utilicen, estarán sujetas a las normas aplicables y a las opciones ofrecidas a los usuarios.</p><p>El bloqueo de tecnologías estrictamente necesarias puede impedir determinadas funcionalidades.</p>"], ["13. Transferencias internacionales", "<p>Algunos proveedores de infraestructura, autenticación, pagos, IA o soporte pueden procesar datos fuera de Brasil. Cuando exista una transferencia internacional, TubeX procurará utilizar mecanismos compatibles con los requisitos aplicables de protección de datos y limitar el tratamiento a lo necesario.</p>"], ["14. Niños y menores", "<p>El servicio está dirigido a creadores de contenido y no está diseñado específicamente para niños. Cuando se traten datos de niños o menores, se tendrán en cuenta las normas legales aplicables y el interés superior del titular.</p>"], ["15. Datos públicos y métricas de YouTube", "<p>Algunas funciones analizan información pública o información legítimamente disponible mediante las APIs de YouTube. Los indicadores propios de TubeX, como puntuaciones, estimaciones, competencia, oportunidades o recomendaciones, son cálculos producidos por la plataforma y no son métricas oficiales de YouTube.</p>"], ["16. Cambios en esta Política", "<p>Esta Política puede actualizarse para reflejar cambios legales, técnicos, operativos o de funcionalidades. La versión vigente se publicará en esta página con su fecha de actualización. Cuando la legislación exija una comunicación específica o un nuevo consentimiento, se adoptarán las medidas correspondientes.</p>"], ["17. Contacto de privacidad", "<p><strong>Correo:</strong> <a href=\"mailto:gabrielbzago@gmail.com\">gabrielbzago@gmail.com</a><br><strong>Sitio web oficial:</strong> <a href=\"https://www.tubex.app.br\">www.tubex.app.br</a></p><p>El canal anterior también puede utilizarse para solicitudes relacionadas con los derechos de protección de datos aplicables. Cuando el marco jurídico no exija la designación formal de un responsable de protección de datos, el mismo canal se utilizará para las comunicaciones de privacidad.</p>"]]}};
const LINKS = ["index.html", "privacy.html", "termos.html", "planos.html", "reembolso.html", "cancelamento.html", "updates.html"];
const EMAIL = "gabrielbzago@gmail.com";
const languages = ["pt-BR","pt-PT","en","es"];
const selector = document.getElementById("language");

function render(lang){
  const d = DATA[lang];
  document.documentElement.lang = lang;
  document.title = d.title + " • TubeX";
  selector.innerHTML = languages.map((l,i)=>`<option value="${l}">${d.options[i]}</option>`).join("");
  selector.value = lang;
  document.getElementById("languageLabel").textContent = d.label;
  document.getElementById("badge").textContent = d.badge;
  document.getElementById("pageTitle").textContent = d.title;
  document.getElementById("pageDesc").textContent = d.desc;
  document.getElementById("updated").textContent = d.updated;
  document.getElementById("summaryLabel").textContent = lang==="en" ? "Summary:" : lang==="es" ? "Resumen:" : "Resumo:";
  document.getElementById("summary").textContent = d.summary;
  document.getElementById("loginBtn").textContent = d.login;

  const nav = document.getElementById("navLinks");
  nav.innerHTML = d.nav.map((name,i)=>`<a href="${LINKS[i]}" class="${i===1?"important":""}">${name}</a>`).join("");

  const list = DATA[lang].sections;
  document.getElementById("content").innerHTML = list.map((s,i)=>`<section id="s${i+1}" class="card"><h2>${s[0]}</h2>${s[1]}</section>`).join("");
  document.getElementById("toc").innerHTML = list.map((s,i)=>`<a href="#s${i+1}">${s[0].replace(/^\\d+\\.\\s*/,"")}</a>`).join("");

  document.getElementById("footerTag").textContent = d.footer;
  document.getElementById("footerLinks").innerHTML = d.nav.slice(1).map((n,i)=>`<a href="${LINKS[i+1]}">${n.replace(/^🔒\\s*/,"")}</a>`).join("");
  document.getElementById("footerBottom").innerHTML =
    `${d.last}<br>${d.support}: <a href="mailto:${EMAIL}">${EMAIL}</a> • WhatsApp: 19 99203‑6896<br>© TubeX — Desenvolvido por Gabriel Zago. TubeX is an independent platform and is not affiliated with, sponsored by, or endorsed by YouTube or Google LLC.`;
  localStorage.setItem("tubex_privacy_language", lang);
}
const saved = localStorage.getItem("tubex_privacy_language");
selector.addEventListener("change",()=>render(selector.value));
render(languages.includes(saved) ? saved : "pt-BR");
</script>
